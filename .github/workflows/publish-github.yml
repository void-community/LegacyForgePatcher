name: GitHub Release Workflow
on:
  workflow_call:
    inputs:
      version:
        description: Exact version of the agents validated in this run
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'void-community/LegacyForgePatcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-*
          path: artifacts/agent
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jar
          path: artifacts/jar
      - name: Name the validated agents after their platforms
        run: |
          mkdir -p artifacts/release
          cp artifacts/jar/LegacyForgePatcher.jar artifacts/release/legacyforgepatcher.jar
          for agent in artifacts/agent/*/LegacyForgePatcher.so; do
            platform="$(basename "$(dirname "$agent")")"
            cp "$agent" "artifacts/release/legacyforgepatcher-$platform.so"
          done
          ls artifacts/release
      # GitHub refuses to let this token create the release's tag while main's head has other workflow files than this commit, as it does once a commit
      # that changes a workflow lands while this run tests. That commit's own run publishes the newer agents instead.
      - name: Check that main runs this commit's workflows
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq '[.files[].filename | select(startswith(".github/workflows/"))] | join(", ")')"
          if [ -n "$changed" ]; then
            echo "::notice::Main has changed $changed since this commit, so its own run publishes the release instead of this one."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the validated agents
        if: steps.workflows.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" artifacts/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
