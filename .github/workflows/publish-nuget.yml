name: NuGet Workflow
on:
  workflow_call:
    inputs:
      version:
        description: Exact version of the package validated in this run
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'void-community/LegacyForgePatcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages
      - name: Exchange GitHub identity for a short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: caunt
      - name: Publish the validated package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/LegacyForgePatcher.$PACKAGE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
