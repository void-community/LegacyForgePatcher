name: Build Workflow
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timestamp:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - name: Build and run unit tests
        run: |
          dotnet build LegacyForgePatcher.slnx -c Release
          dotnet test LegacyForgePatcher.slnx -c Release --no-build
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_RID: ${{ matrix.rid }}
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - name: Prepare Linux native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the native agent
        run: dotnet publish src -c Release -r "$TARGET_RID" -o "artifacts/agent/$TARGET_RID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-${{ matrix.rid }}
          path: artifacts/agent/*/LegacyForgePatcher.so
          if-no-files-found: error
