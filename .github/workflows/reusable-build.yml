name: Build Workflow
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timestamp:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - name: Build and run unit tests
        run: |
          dotnet build LegacyForgePatcher.slnx -c Release
          dotnet test LegacyForgePatcher.slnx -c Release --no-build
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_RID: ${{ matrix.rid }}
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - name: Prepare Linux native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang zlib1g-dev
      # Links the agent against the Ubuntu 18.04 sysroot of .NET's cross-build image, so that it loads on glibc 2.17 and later instead of needing the runner's
      # glibc (2.34 and later on ubuntu-24.04). Renovate updates the pinned commit when void-community/Actions changes.
      - name: Prepare the glibc 2.17 sysroot
        id: sysroot
        uses: void-community/actions/glibc-sysroot@779ebfbf56a61e10114658c560da49324f0f2380 # main
        with:
          rid: ${{ matrix.rid }}
      - name: Publish the native agent and its jar
        env:
          SYSROOT_PROPERTIES: ${{ steps.sysroot.outputs.properties }}
        run: |
          # SYSROOT_PROPERTIES is meant to split into separate arguments.
          # shellcheck disable=SC2086
          dotnet publish src -c Release -r "$TARGET_RID" $SYSROOT_PROPERTIES -o "artifacts/agent/$TARGET_RID"
      - name: Check the agent's glibc floor
        run: |
          floor="$(readelf -V "artifacts/agent/$TARGET_RID/LegacyForgePatcher.so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "LegacyForgePatcher.so asks for $floor at most"
          if [ "$(printf '%s\n' GLIBC_2.17 "$floor" | sort -V | tail -1)" != GLIBC_2.17 ]; then
            echo "::error::LegacyForgePatcher.so asks for $floor, newer than glibc 2.17."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-${{ matrix.rid }}
          path: artifacts/agent/*/LegacyForgePatcher.so
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jar-${{ matrix.rid }}
          path: artifacts/agent/*/LegacyForgePatcher.jar
          if-no-files-found: error
  jar:
    needs: agent
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: jar-*
          path: artifacts/agent
          merge-multiple: true
      # The combined jar holds the library of every platform, so one file serves java -javaagent anywhere. The tests and the release use this very file.
      - name: Combine the jars of the platforms into one
        run: dotnet msbuild src/LegacyForgePatcher.csproj -restore -t:JvmBridgeMergeAgentJars -p:JvmBridgeAgentJars="../artifacts/agent/*/LegacyForgePatcher.jar" -p:JvmBridgeAgentJarOutput=../artifacts/jar/LegacyForgePatcher.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jar
          path: artifacts/jar/LegacyForgePatcher.jar
          if-no-files-found: error
